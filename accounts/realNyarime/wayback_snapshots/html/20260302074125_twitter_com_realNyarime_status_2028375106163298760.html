  最近微软又在搞事，在Windows Update后会默认启用麦克风的音频增强，导致麦克风音质非常糟糕！
  <br/>
  关闭的方法很简单：
  <br/>
  直接在设置-系统-声音-选择输入设备-关闭音频增强
  <br/>
  <br/>
  如果找不到，也可以用控制面板关：
  <br/>
  1）在开始菜单搜索“更改系统声音”
  <br/>
  2）点录制，再右键麦克风，进属性
  <br/>
  3）点高级，找到“信号增强”，关闭“启用音频增强”
  <br/>
  <br/>
  最草的是，每个设备都得这么关一次。即使有了新设备还得逐一关闭，真是坏事做尽... 何意味？
