  eSIM和护照很像，一个存电话卡的Profile，另一个存签证
  <br/>
  <br/>
  它有两种形式，单eUICC芯片焊在设备上、转接成NanoSIM放在卡槽里；
  <br/>
  而以前的通行证和护照一样是本式，现在变成了卡式，仍不影响出入境续签注。
  <br/>
  <br/>

  <br/>
  所以不要总把eSIM当成电话卡，它只是这些eSIM Profile的载体，充当介质的作用。
