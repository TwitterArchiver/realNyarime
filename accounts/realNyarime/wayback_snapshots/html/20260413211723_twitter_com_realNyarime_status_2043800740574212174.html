  @lrssd 本身UDP demux天然支持单端口多用户，即每个 Accept() 就是独立客户端连接
  <br/>
  按源地址自动分流Accept() --&gt; 读Token认证 --&gt; 令牌桶限速 --&gt; 转发
  <br/>
  <br/>
  如果还需要 TCP 支持（UDP被封时降级），可以搭配 NRTP（TCP对应库）：
  <br/>
  <a href="https://web.archive.org/web/20260413211723/https://github.com/Nyarime/NRTP" rel="noopener noreferrer" target="_blank">

  </a>
  <br/>
  <br/>
  即NRUP(UDP) + NRTP(TCP) 就能实现完整传输层了
