  爱快(ikuai)软路由4.0免费版公测了，之前一直是内测，除了UI界面外也没有多大的更新。
  <br/>
  不过还是跟3.7.x一样，WireGuard并没有下方。虽然可以不连云平台加载Docker插件，但还是有诸多限制。
  <br/>
  <br/>
  据不可靠小道消息，爱快4将会引入授权，后续应该会从纯卖硬件送系统变成卖硬件卖软件授权的模式。
  <br/>
  不过有用root进去shell的软路由玩家应该知道，这个“自研”系统一股openwrt的味，甚至把opkg换成了自己的pmd。
  <br/>
  <br/>
  总之这个系统问题还是蛮多的，如果要ikuai+openwrt组合，其实不如建议买个UniFi要舒服得多🤣
