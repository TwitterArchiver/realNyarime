  简单说，就是让梯子和网站一起共用443端口，实现nginx 反代Xray（支持REALITY&amp;XHTTP）。
  <br/>
  <br/>
  利用 Nginx 的 SNI（Server Name Indication）分流功能，让 Nginx 识别真实域名请求（伪装网站）并转发给网站服务，识别 Xray 伪装域名的请求则转发给 Xray 进程处理，实现一个端口多用，即正常建站 + Xray 科学上网同时进行，主要通过 Nginx 配置 map 和 server 块来区分不同域名的请求，实现请求的智能路由。
