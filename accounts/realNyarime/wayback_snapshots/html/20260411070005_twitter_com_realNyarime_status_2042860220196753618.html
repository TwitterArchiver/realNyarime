  由于现在openai把gpt team的额度下调了，导致每个seat的codex额度不太够用。一个0刀试用的gpt team里面可以有5个seat，当team中的成员变成6个就会有封team的风险。
  <br/>
  <br/>
  有个思路就是堆叠号池，把用完team额度的旧号成员踢掉，再换上新注册的账号顶上，等旧号恢复后再拉回来接着用。并将gpt team中的5个席位不断换人，就可以维持可用度
  <br/>
  <br/>
  GitHub上正好有这样的自动化workflow可以做到不断轮转这5个seat实现全程自动化
